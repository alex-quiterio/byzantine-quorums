name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replication:
    name: Replication protocols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 8: wsimport, used to generate the SOAP client classes, was
      # removed from the JDK in Java 11.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - uses: actions/cache@v4
        with:
          path: build/ci/lib
          key: ci-lib-${{ hashFiles('ci/replication-tests.sh') }}

      - name: Run replication tests
        run: ci/replication-tests.sh
